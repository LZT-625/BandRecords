<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="跟館青出去走一走｜公館青少年演出、歌曲與作品紀錄">
  <title>跟館青出去走一走｜BandRecords</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="主要導覽">
      <a class="brand" href="index.html" aria-label="回到首頁">
        <div class="brand-logo">
          <span class="brand-logo-fallback">GGteens</span>
        </div>
      </a>
      <div class="nav-spacer" aria-hidden="true"></div>
      <div class="site-nav">
        <a href="event_review.html">演出紀錄</a>
        <a href="song_list.html">館青的作品</a>
        <a href="2026recap.html">年度回顧</a>
      </div>
    </nav>
  </header>

  <main>
    <section id="mainpage">
      <div class="mainpage-copy">
        <h1>跟館青出去走一走</h1>
        <p>今天又要走去哪呢？</p>
      </div>

      <aside class="recent-news-panel" aria-labelledby="recent-news-title">
        <h2 id="recent-news-title">最近大事</h2>
        <div id="news-list" class="news-list">
          <article class="news-card">
            <h3>年度專場最終場</h3>
            <p>最終場將於 9/13 舉行。</p>
          </article>
          <article class="news-card">
            <h3>貝斯手調整</h3>
            <p>蝦蛄老師自澎大海沙灘音樂祭起暫時接替婉玲。</p>
          </article>
        </div>
      </aside>
    </section>

    <section id="latest_event">
      <div class="section-shell">
        <div class="section-heading-row">
          <div>
            <h2 class="section-title">即將到來的演出</h2>
          </div>
          <a class="section-link" href="event_review.html">查看完整演出紀錄 →</a>
        </div>
        <div id="upcoming-events" class="upcoming-events-list"></div>
      </div>
    </section>

    <section id="song_ranking">
      <div class="section-shell">
        <h2 class="section-title">年度歌曲演出機率</h2>
        <p class="section-description">依目前已匯入的年度演出歌單資料計算歌曲出現比例，資料增加時會重新計算。</p>
        <div id="ranking-list" class="ranking-list"></div>

        <div class="home-works-preview" aria-labelledby="latest-works-title">
          <div class="section-heading-row">
            <div>
              <h2 id="latest-works-title" class="section-title section-title--small">最新作品</h2>
            </div>
            <a class="section-link" href="song_list.html">查看歌曲資料庫 →</a>
          </div>
          <div class="works-grid">
            <article class="work-card">
              <h4>最新發行單曲</h4>
              <iframe
                class="spotify-embed"
                src="https://open.spotify.com/embed/track/2ObQBIEZqWlpjHOCIquJpc?utm_source=generator"
                width="100%"
                height="152"
                frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"
                title="Spotify 最新發行單曲">
              </iframe>
            </article>
            <article class="work-card">
              <h4>最新發行EP/專輯</h4>
              <iframe
                class="spotify-embed"
                src="https://open.spotify.com/embed/album/1Fs6PqQFvSh8ovcWbeMOaq?utm_source=generator"
                width="100%"
                height="352"
                frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"
                title="Spotify 最新發行EP／專輯">
              </iframe>
            </article>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="event-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" aria-label="關閉" data-close-modal>×</button>
      <h2 id="modal-title">演出詳細資料</h2>
      <div id="modal-content" class="detail-layout"></div>
    </article>
  </div>

  <footer class="site-footer">
    <p>BandRecords · 跟館青出去走一走</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
